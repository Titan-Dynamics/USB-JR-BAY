name: Build

on:
  push:  # Run on push to any branch
    branches:
      - '**' # All branches
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            data_sep: ';'
            icon_arg: '--icon=icon.ico'
          - os: macos-latest
            label: macOS-arm64
            data_sep: ':'
            icon_arg: '--icon=icon.ico'
          - os: macos-13
            label: macOS-x86_64
            data_sep: ':'
            icon_arg: '--icon=icon.ico'
          - os: ubuntu-latest
            label: Linux
            data_sep: ':'
            icon_arg: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r tools/feeder/requirements.txt
        shell: bash

      - name: Install Pillow for icon conversion
        if: runner.os == 'macOS'
        run: pip install pillow  # PyInstaller needs it to turn icon.ico into an .icns

      - name: Generate static version file
        run: |
          # Get short git SHA
          GIT_SHA=$(git rev-parse --short=7 HEAD)

          # Get semantic version from tag, or use 0.0.0-dev if not a tagged release
          if git describe --tags --exact-match HEAD 2>/dev/null; then
            APP_VERSION=$(git describe --tags --exact-match HEAD | sed 's/^v//')
          else
            APP_VERSION="0.0.0-dev"
          fi

          # Export for next steps
          echo "GIT_SHA=$GIT_SHA" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          # Generate static version_info.py file that will be baked into the executable
          cd tools/feeder
          python generate_version.py
        shell: bash
        env:
          GIT_SHA: ${{ env.GIT_SHA }}
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Build executable with PyInstaller
        run: |
          cd tools/feeder
          pyinstaller --onefile --windowed ${{ matrix.icon_arg }} \
            --add-data "icon.ico${{ matrix.data_sep }}." \
            --name="USB_JR_Bay" feeder.py
        shell: bash

      - name: Package executable
        run: |
          mkdir -p release
          case "$RUNNER_OS" in
            Windows)
              cp "tools/feeder/dist/USB_JR_Bay.exe" "release/USB_JR_Bay.exe"
              ;;
            macOS)
              # --windowed produces an .app bundle; zip it so the bundle survives download
              ditto -c -k --keepParent "tools/feeder/dist/USB_JR_Bay.app" \
                "release/USB_JR_Bay-${{ matrix.label }}.zip"
              ;;
            Linux)
              cp "tools/feeder/dist/USB_JR_Bay" "release/USB_JR_Bay-Linux"
              chmod +x "release/USB_JR_Bay-Linux"
              ;;
          esac
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: USB_JR_Bay-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
